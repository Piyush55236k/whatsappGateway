services:
  db:
    image: mysql:8.0
    container_name: wa-akg-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-wa_root_password}
      MYSQL_DATABASE: ${DB_NAME:-wa_gateway_db}
      MYSQL_USER: ${DB_USER:-wa_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wa_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${DB_ROOT_PASSWORD:-wa_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-akg-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://${DB_USER:-wa_user}:${DB_PASSWORD:-wa_password}@db:3306/${DB_NAME:-wa_gateway_db}
      - AUTH_SECRET=${AUTH_SECRET:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      - AUTH_TRUST_HOST=true
      - BASE_URL=${BASE_URL:-http://localhost:3030}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3030}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3030}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3030/api}
      - NODE_ENV=production
      - PORT=3030
      - TZ=${TZ:-Asia/Kolkata}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-}
    ports:
      - "${PORT:-3030}:3030"
    volumes:
      - ./data:/app/data
    command: >
      sh -c "npx prisma db push && node scripts/setup-admin.js $${ADMIN_EMAIL:-admin@example.com} $${ADMIN_PASSWORD:-admin123} && npm run start"

volumes:
  mysql_data:
